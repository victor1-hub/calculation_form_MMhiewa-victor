<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM HIEWA Calculation Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #e8edf3; color: #111; }
    .app { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px; max-width: 1180px; margin: 0 auto; padding: 18px; }
    .panel { align-self: start; padding: 16px; border: 1px solid #d2d9e1; border-radius: 8px; background: #f4f6f8; box-shadow: 0 12px 28px rgba(20, 30, 40, 0.08); }
    h1 { margin: 0 0 6px; font-size: 20px; line-height: 1.2; }
    p { margin: 0 0 14px; color: #687382; font-size: 13px; line-height: 1.4; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    button { min-height: 40px; border: 0; border-radius: 6px; padding: 8px 10px; color: #fff; background: #126c92; font: 700 13px/1 Arial, Helvetica, sans-serif; cursor: pointer; }
    button.secondary { color: #111; background: #dfe5ec; }
    button.danger { background: #9b2d30; }
    button:hover { filter: brightness(0.94); }
    .preview { min-width: 0; overflow: auto; padding-bottom: 18px; }
    .sheet { position: relative; width: 794px; height: 1123px; margin: 0 auto; background: #fff; box-shadow: 0 18px 42px rgba(20, 30, 40, 0.18); }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; user-select: none; pointer-events: none; z-index: 1; }
    .mark-field { position: absolute; z-index: 2; }
    .text-field { border: 0; border-radius: 0; padding: 0 5px; background: rgba(255,255,255,0.02); color: #000; outline: none; font: 700 15px/20px Arial, Helvetica, sans-serif; }
    .amount-field { text-align: right; }
    .label-field { text-align: left; font-size: 14px; }
    .text-field:focus { background: rgba(232, 247, 253, 0.8); box-shadow: inset 0 0 0 2px rgba(18, 108, 146, 0.28); }
    .check-field { appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer; }
    .check-field:checked::after { content: "√"; display: block; width: 100%; color: #000; font: 900 21px/20px Arial, Helvetica, sans-serif; text-align: center; }
    .check-field:focus { outline: 2px solid rgba(18,108,146,0.45); outline-offset: 1px; }
    @media (max-width: 1050px) { .app { grid-template-columns: 1fr; } .panel { max-width: 794px; width: 100%; margin: 0 auto; } }
    @media (max-width: 840px) { .preview { overflow-x: auto; } .sheet { margin: 0; } }
    @media print {
      body { background: #fff; } .panel { display: none; } .app { display: block; max-width: none; padding: 0; } .preview { overflow: visible; padding: 0; }
      .sheet { width: 210mm; height: 297mm; margin: 0; box-shadow: none; } .bg, .text-field, .check-field { print-color-adjust: exact; -webkit-print-color-adjust: exact; } .text-field { background: transparent; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>

        <button type="button" id="clearBtn" class="danger">Clear</button>
        <button type="button" id="sampleBtn" class="secondary">Sample</button>
      </div>

  <script>
    const form = document.getElementById("calculationForm");
    const storageKey = "mm-hiewa-calculation-original-bg";
    function todayText() { const now = new Date(); const day = String(now.getDate()).padStart(2, "0"); const month = String(now.getMonth() + 1).padStart(2, "0"); return `${day}/${month}/${now.getFullYear()}`; }
    function collectData() { const data = {}; form.querySelectorAll("input").forEach((input) => { data[input.name] = input.type === "checkbox" ? input.checked : input.value; }); return data; }
    function saveData() { localStorage.setItem(storageKey, JSON.stringify(collectData())); }
    function loadData() { const data = JSON.parse(localStorage.getItem(storageKey) || "{}"); form.querySelectorAll("input").forEach((input) => { if (!(input.name in data)) return; if (input.type === "checkbox") input.checked = Boolean(data[input.name]); else input.value = data[input.name]; }); }
    function clearForm() { form.querySelectorAll("input").forEach((input) => { if (input.type === "checkbox") input.checked = false; else input.value = ""; }); localStorage.removeItem(storageKey); }
    function loadSample() { const sample = { date: todayText(), sa_broker: "SA / Broker Name", customer_name: "Customer Name", model: "Toyota Model", chassis_no: "Chassis No", engine: "Engine No", colour: "White", price_without_insurance: "100,000.00", less_ncd_checked: true, total_insurance: "2,500.00", total_amount_with_insurance: "102,500.00", pearl_white: "800.00", accessories: "500.00", total_nett_invoice: "103,800.00", loan_amount: "90,000.00", booking_fee: "500.00", deposit: "3,300.00", total_amount_due_to_us: "10,000.00" }; form.querySelectorAll("input").forEach((input) => { if (input.type === "checkbox") input.checked = Boolean(sample[input.name]); else input.value = sample[input.name] || ""; }); saveData(); }
    form.addEventListener("input", saveData); form.addEventListener("change", saveData); document.getElementById("printBtn").addEventListener("click", () => window.print()); document.getElementById("todayBtn").addEventListener("click", () => { form.elements.date.value = todayText(); saveData(); }); document.getElementById("clearBtn").addEventListener("click", clearForm); document.getElementById("sampleBtn").addEventListener("click", loadSample); loadData();
  </script>
